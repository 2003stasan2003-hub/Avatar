<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>AI Assistant</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; background: #121212; color: white; justify-content: center; align-items: center; }
    #container { width: 600px; height: 80vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; background: #1e1e1e; border-radius: 10px; border: 1px solid #333; }
    h2 { text-align: center; margin-top: 0; color: #4da6ff; }
    #chat-box { flex: 1; overflow-y: auto; border: 1px solid #444; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #121212; }
    .controls { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 16px; }
    button { padding: 12px 20px; border-radius: 5px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
    button:hover { background: #0056b3; }
    #mic-btn { background: #28a745; }
    #mic-btn:hover { background: #218838; }
    .msg-user { margin-bottom: 12px; }
    .msg-ai { margin-bottom: 12px; color: #4da6ff; }
  </style>
</head>
<body>

  <div id="container">
    <h2>ШІ Асистент</h2>
    <div id="chat-box"></div>
    <div class="controls">
      <input type="text" id="user-input" placeholder="Напиши повідомлення...">
      <button id="mic-btn" onclick="startListening()" title="Голосовий ввід">🎤</button>
      <button onclick="handleSend()">Send</button>
    </div>
  </div>

  <script>
    // Твій робочий ключ Groq
    const GROQ_API_KEY = "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";
    const MODEL_NAME = "openai/gpt-oss-20b";

    document.getElementById('user-input').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        handleSend();
      }
    });

    // Захищене розпізнавання голосу
    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Браузер не підтримує розпізнавання голосу.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      const micBtn = document.getElementById('mic-btn');

      micBtn.style.background = '#dc3545';

      recognition.onresult = function(event) {
        try {
          if (event && event.results && event.results[0] && event.results[0][0]) {
            const speechToText = event.results[0][0].transcript;
            if (speechToText) {
              document.getElementById('user-input').value = speechToText;
              handleSend();
            }
          }
        } catch (e) {
          console.error("Помилка мікрофона:", e);
        }
        micBtn.style.background = '#28a745';
      };

      recognition.onerror = function() { micBtn.style.background = '#28a745'; };
      recognition.onend = function() { micBtn.style.background = '#28a745'; };

      recognition.start();
    }

    // Озвучення через локальний Python-сервер
    async function speakText(text) {
      try {
        const response = await fetch('http://localhost:5000/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) return;

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        audio.play();
      } catch (e) {
        console.error("Сервер озвучення не відповідає:", e);
      }
    }

    // Надсилання повідомлення до Groq API
    async function handleSend() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const message = input.value.trim();

      if (!message) return;

      chatBox.innerHTML += `<div class="msg-user"><b>Ви:</b> ${message}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const cleanKey = GROQ_API_KEY.replace(/[^\x00-\x7F]/g, "").trim();

        chatBox.innerHTML += `<div id="loading" style="color:yellow;">AI думає...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + cleanKey
          },
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: [
              { role: "system", content: "You are a helpful assistant. Reply concisely in Ukrainian." },
              { role: "user", content: message }
            ]
          })
        });

        const data = await response.json();
        
        const loader = document.getElementById('loading');
        if (loader) loader.remove();

        if (data.error) {
          throw new Error(data.error.message || 'Помилка API');
        }

        let reply = "";
        if (data && Array.isArray(data.choices) && data.choices.length > 0) {
          if (data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
            reply = data.choices[0].message.content;
          }
        }

        if (reply) {
          chatBox.innerHTML += `<div class="msg-ai"><b>AI:</b> ${reply}</div>`;
          chatBox.scrollTop = chatBox.scrollHeight;
          
          // Озвучуємо відповідь голосом
          speakText(reply);
        } else {
          throw new Error('Отримано порожню відповідь');
        }

      } catch (err) {
        const loader = document.getElementById('loading');
        if (loader) loader.remove();
        
        chatBox.innerHTML += `<div style="color:red;">Помилка: ${err.message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
