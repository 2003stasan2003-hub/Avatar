<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>ШІ Асистент з 3D Аватаром</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; background: #121212; color: white; }
    #left-avatar { width: 50%; height: 100%; border-right: 2px solid #333; }
    #right-chat { width: 50%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
    #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #1e1e1e; }
    .controls { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; }
    button { padding: 12px 20px; border-radius: 5px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
  </style>
  <!-- Підключення бібліотеки Three.js для 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <!-- Ліва частина: 3D Аватар -->
  <div id="left-avatar"></div>

  <!-- Права частина: Чат -->
  <div id="right-chat">
    <h2>ШІ Асистент</h2>
    <div id="chat-box"></div>
    <div class="controls">
      <input type="text" id="user-input" placeholder="Запитайте щось або використовуйте голос...">
      <button onclick="startVoice()">🎤 Голос</button>
      <button onclick="sendMessage()">Надіслати</button>
    </div>
  </div>

  <script>
    // 🔑 Вставте сюди свій ключ з вкладки "Ключі API | Google AI Studio", яка у вас відкрита!
    const GEMINI_API_KEY = "AQ.Ab8RN6LriDCts8CrcMkeAipv_71KQFVuUjRC6SAfaTk0KJwL6w";

    // --- 1. 3D Сцена ---
    const container = document.getElementById('left-avatar');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.4, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(light);

    // Завантаження готової безкоштовної 3D-моделі
    let avatar;
    const loader = new THREE.GLTFLoader();
    loader.load('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/RobotExpressive/glTF-Binary/RobotExpressive.glb', (gltf) => {
      avatar = gltf.scene;
      avatar.position.set(0, 0, 0);
      scene.add(avatar);
    });

    function animate() {
      requestAnimationFrame(animate);
      if (avatar) avatar.rotation.y += 0.005; // Легке обертання для анімації
      renderer.render(scene, camera);
    }
    animate();

    // --- 2. Голосовий ввід ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'uk-UA';

    function startVoice() {
      recognition.start();
    }

    recognition.onresult = function(event) {
      document.getElementById('user-input').value = event.results[0][0].transcript;
      sendMessage();
    };

    // --- 3. Зв'язок з Gemini ШІ ---
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const message = input.value;
      if (!message) return;

      chatBox.innerHTML += `<p><b>Ви:</b> ${message}</p>`;
      input.value = '';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;

        chatBox.innerHTML += `<p><b>ШІ:</b> ${reply}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        // Озвучка відповіді
        const utterance = new SpeechSynthesisUtterance(reply);
        utterance.lang = 'uk-UA';
        window.speechSynthesis.speak(utterance);

      } catch (err) {
        chatBox.innerHTML += `<p style="color:red;">Помилка: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
