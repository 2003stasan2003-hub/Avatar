<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>ШІ Асистент</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; background: #121212; color: white; }
    #left-avatar { width: 50%; height: 100%; border-right: 2px solid #333; background: #1a1a2e; display: flex; align-items: center; justify-content: center; color: #888; font-size: 18px; }
    #right-chat { width: 50%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
    #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #1e1e1e; }
    .controls { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; }
    button { padding: 12px 20px; border-radius: 5px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <!-- Left placeholder for future 3D avatar -->
  <div id="left-avatar">3D Avatar Area</div>

  <!-- Right side: Chat and controls -->
  <div id="right-chat">
    <h2>ШІ Асистент</h2>
    <div id="chat-box"></div>
    <div class="controls">
      <input type="text" id="user-input" placeholder="Запитайте щось або використовуйте голос...">
      <button onclick="startVoice()">🎤 Голос</button>
      <button onclick="sendMessage()">Надіслати</button>
    </div>
  </div>

  <script>
    // Groq API Key configuration
    const GROQ_API_KEY = "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";

    // --- 1. Speech Recognition (Web Speech API) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      recognition.onresult = function(event) {
        document.getElementById('user-input').value = event.results[0][0].transcript;
        sendMessage();
      };
    }

    function startVoice() {
      if (recognition) {
        recognition.start();
      } else {
        alert('Voice input is not supported in this browser.');
      }
    }

    // --- 2. Groq API Request & Ukrainian Text-to-Speech ---
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const message = input.value.trim();
      if (!message) return;

      chatBox.innerHTML += `<p><b>Ви:</b> ${message}</p>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const cleanKey = GROQ_API_KEY.replace(/[^\x00-\x7F]/g, "").trim();

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + cleanKey
          },
          body: JSON.stringify({
            model: "llama3-8b-8192",
            messages: [
              { role: "system", content: "Ти україномовний голосовий асистент. Відповідай виключно українською мовою, коротко, зрозуміло та приязно." },
              { role: "user", content: message }
            ]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || 'API Error');
        }

        if (data.choices && data.choices[0] && data.choices[0].message) {
          const reply = data.choices[0].message.content;
          chatBox.innerHTML += `<p><b>ШІ:</b> ${reply}</p>`;
          chatBox.scrollTop = chatBox.scrollHeight;

          // Text-to-Speech (Ukrainian)
          const utterance = new SpeechSynthesisUtterance(reply);
          utterance.lang = 'uk-UA';
          utterance.rate = 1.0;
          utterance.pitch = 1.0;

          const voices = window.speechSynthesis.getVoices();
          const ukVoice = voices.find(v => v.lang === 'uk-UA' || v.lang.includes('uk'));
          if (ukVoice) {
            utterance.voice = ukVoice;
          }

          window.speechSynthesis.speak(utterance);
        }
      } catch (err) {
        chatBox.innerHTML += `<p style="color:red;">Error: ${err.message}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
