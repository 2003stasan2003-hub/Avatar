<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>AI Assistant</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; background: #121212; color: white; }
    #left-avatar { width: 50%; height: 100%; border-right: 2px solid #333; background: #1a1a2e; display: flex; align-items: center; justify-content: center; color: #888; font-size: 18px; }
    #right-chat { width: 50%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
    #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #1e1e1e; }
    .controls { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; }
    button { padding: 12px 20px; border-radius: 5px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    #mic-btn { background: #28a745; }
    #mic-btn:hover { background: #218838; }
    .msg-user { margin-bottom: 10px; }
    .msg-ai { margin-bottom: 10px; color: #4da6ff; }
  </style>
</head>
<body>

  <div id="left-avatar">3D Avatar Area</div>

  <div id="right-chat">
    <h2>AI Assistant</h2>
    <div id="chat-box"></div>
    <div class="controls">
      <input type="text" id="user-input" placeholder="Type a message...">
      <button id="mic-btn" onclick="startListening()" title="Голосовий ввід">🎤</button>
      <button onclick="handleSend()">Send</button>
    </div>
  </div>

  <script>
    const GROQ_API_KEY = "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";
    const MODEL_NAME = "openai/gpt-oss-20b";

    document.getElementById('user-input').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        handleSend();
      }
    });

    // Безопасное распознавание речи через микрофон
    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Браузер не підтримує розпізнавання голосу.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      const micBtn = document.getElementById('mic-btn');

      micBtn.style.background = '#dc3545';

      recognition.onresult = function(event) {
        if (event && event.results && event.results[0] && event.results[0][0]) {
          const speechToText = event.results[0][0].transcript;
          if (speechToText) {
            document.getElementById('user-input').value = speechToText;
            handleSend();
          }
        }
        micBtn.style.background = '#28a745';
      };

      recognition.onerror = function() { micBtn.style.background = '#28a745'; };
      recognition.onend = function() { micBtn.style.background = '#28a745'; };

      recognition.start();
    }

    // Озвучивание через локальный Python-сервер
    async function speakText(text) {
      try {
        const response = await fetch('http://localhost:5000/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) return;

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        audio.play();
      } catch (e) {
        console.error("Помилка озвучення (сервер може бути вимкнений):", e);
      }
    }

    async function handleSend() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const message = input.value.trim();

      if (!message) {
        alert('Please enter a message!');
        return;
      }

      chatBox.innerHTML += `<div class="msg-user"><b>You:</b> ${message}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const cleanKey = GROQ_API_KEY.replace(/[^\x00-\x7F]/g, "").trim();

        chatBox.innerHTML += `<div id="loading" style="color:yellow;">AI is thinking...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + cleanKey
          },
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: [
              { role: "system", content: "You are a helpful assistant. Reply in the same language the user speaks." },
              { role: "user", content: message }
            ]
          })
        });

        const data = await response.json();
        
        const loader = document.getElementById('loading');
        if (loader) loader.remove();

        if (data.error) {
          throw new Error(data.error.message || 'API Error');
        }

        if (data.choices && data.choices[0] && data.choices[0].message) {
          const reply = data.choices[0].message.content;
          chatBox.innerHTML += `<div class="msg-ai"><b>AI:</b> ${reply}</div>`;
          chatBox.scrollTop = chatBox.scrollHeight;
          
          // Озвучиваем ответ через Python-сервер
          speakText(reply);
        } else {
          throw new Error('Invalid response format');
        }

      } catch (err) {
        const loader = document.getElementById('loading');
        if (loader) loader.remove();
        
        chatBox.innerHTML += `<div style="color:red;">Error: ${err.message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
