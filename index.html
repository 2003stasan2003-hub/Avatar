<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>ШІ Асистент з 3D Аватаром</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; background: #121212; color: white; }
    #left-avatar { width: 50%; height: 100%; border-right: 2px solid #333; position: relative; }
    #right-chat { width: 50%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
    #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #1e1e1e; }
    .controls { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; }
    button { padding: 12px 20px; border-radius: 5px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="left-avatar"></div>

  <div id="right-chat">
    <h2>ШІ Асистент</h2>
    <div id="chat-box"></div>
    <div class="controls">
      <input type="text" id="user-input" placeholder="Запитайте щось або використовуйте голос...">
      <button onclick="startVoice()">🎤 Голос</button>
      <button onclick="sendMessage()">Надіслати</button>
    </div>
  </div>

  <script>
    // 🔑 Вставте сюди свій API ключ з Google AI Studio
    const GEMINI_API_KEY = "AQ.Ab8RN6KAp01VDzUCfAYtLVgBABCTEUu1Bv7bMEACVBDazzQ8tw";

    // --- 1. 3D Сцена ---
    const container = document.getElementById('left-avatar');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.3, 2.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(2, 4, 2);
    scene.add(dirLight);

    let avatar, mixer;
    const clock = new THREE.Clock();
    const loader = new THREE.GLTFLoader();

    loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
      avatar = gltf.scene;
      avatar.position.set(0, 0, 0);
      scene.add(avatar);

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(avatar);
        const idleClip = gltf.animations.find(a => a.name === 'Idle' || a.name === 'Wave') || gltf.animations[0];
        if (idleClip) mixer.clipAction(idleClip).play();
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, window.innerHeight);
    });

    // --- 2. Голосовий ввід ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      recognition.onresult = function(event) {
        document.getElementById('user-input').value = event.results[0][0].transcript;
        sendMessage();
      };
    }

    function startVoice() {
      if (recognition) {
        recognition.start();
      } else {
        alert('Голосовий ввід не підтримується у цьому браузері. Використовуйте Chrome або Edge.');
      }
    }

    // --- 3. Надійний запит до актуальної моделі gemini-2.5-flash ---
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const message = input.value;
      if (!message) return;

      chatBox.innerHTML += `<p><b>Ви:</b> ${message}</p>`;
      input.value = '';

      try {
        const cleanKey = GEMINI_API_KEY.trim();
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || 'Помилка API');
        }

        if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
          const reply = data.candidates[0].content.parts[0].text;
          chatBox.innerHTML += `<p><b>ШІ:</b> ${reply}</p>`;
          chatBox.scrollTop = chatBox.scrollHeight;

          const utterance = new SpeechSynthesisUtterance(reply);
          utterance.lang = 'uk-UA';
          window.speechSynthesis.speak(utterance);
        } else {
          chatBox.innerHTML += `<p style="color:orange;">ШІ не зміг сформувати відповідь. Спробуйте ще раз.</p>`;
        }

      } catch (err) {
        chatBox.innerHTML += `<p style="color:red;">Помилка: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
